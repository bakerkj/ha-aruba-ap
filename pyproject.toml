[project]
name = "ha-aruba-ap"
version = "0.0.21" # x-release-please-version
requires-python = ">=3.14.4,<3.15"
dependencies = ["puresnmp>=2.0.0"]

[dependency-groups]
test = [
  # 0.13.360+ pins Home Assistant 2026.9, which this integration now requires
  # (async_get_device_by_identifier / async_get_devices; DeviceInfo dropped
  # via_device). Keep in step with the hacs.json minimum HA version.
  "pytest-homeassistant-custom-component>=0.13.360",
]
dev = [
  { include-group = "test" },
  "mypy>=1.20.0",
]

[tool.mypy]
mypy_path = ["custom_components"]

[[tool.mypy.overrides]]
module = ["puresnmp_plugins.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
required-version = "==0.12.13"
package = false
