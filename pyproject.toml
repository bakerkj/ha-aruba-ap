[project]
name = "ha-aruba-ap"
version = "0.0.24" # x-release-please-version
requires-python = ">=3.14.4,<3.15"
dependencies = ["puresnmp>=2.0.0"]

[dependency-groups]
test = [
  # Pinned exactly: the plugin pins homeassistant exactly, so this IS the HA
  # under test. A `>=` floor never changes, so Renovate never bumps it and the
  # lock silently stays on whatever HA it first resolved.
  "pytest-homeassistant-custom-component==0.13.375",
]
dev = [
  { include-group = "test" },
  "mypy>=1.20.0",
]

[tool.mypy]
mypy_path = ["custom_components"]

[[tool.mypy.overrides]]
module = ["puresnmp_plugins.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
required-version = "==0.13.6"
package = false
